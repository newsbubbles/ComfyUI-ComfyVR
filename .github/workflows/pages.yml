name: demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the zero-install demo
        run: |
          mkdir -p _site/workflows
          cp -r public/* _site/
          cp workflows/index.json _site/workflows/
          for n in $(python3 -c "import json; print(' '.join(json.load(open('workflows/index.json'))))"); do
            cp "workflows/$n.json" _site/workflows/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
